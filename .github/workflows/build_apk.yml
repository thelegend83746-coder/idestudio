name: Build & Release idestudio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Accept Android SDK Licenses
      run: |
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || yes | sdkmanager --licenses || true

    - name: Build APK with Gradle
      run: |
        gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: idestudio-debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: IDE Studio v1.0.0 (Build ${{ github.run_number }})
        body: |
          🚀 **IDE Studio - Mobile Native Android IDE**
          
          ✨ **What's New in this Build:**
          - 🔍 **Two-Finger Pinch-to-Zoom**: Smooth code scaling from 10sp to 36sp with synchronized line numbers
          - ⌨️ **Mobile Symbol Bar**: Fast programming shortcuts (`TAB`, `{ }`, `( )`, `[ ]`, `;`, `->`, etc.)
          - 🤖 **Universal AI Assistant**: Ollama, Groq, OpenRouter, Google Gemini & OpenAI support
          - 🔎 **In-File Find & Replace**: Instant search navigation & replace all
          - 💾 **Project .zip Backups**: One-click standalone backup export
          - 🎨 **Pro VS Code Dark Theme**: Modern typography & real-time status bar
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

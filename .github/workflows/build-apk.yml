name: Build & Release IDE STUDIO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/IDE_Studio-debug.apk
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDE_Studio-debug-apk
          path: output_apk/IDE_Studio-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "IDE STUDIO v1.0.0"
          body: |
            ### 🚀 IDE STUDIO — On-Device Android IDE & APK Builder
            Turnkey on-device Android IDE with complete build pipeline (AAPT2, ECJ, D8, ZipAlign, ApkSigner).
            
            **Download the attached APK below to install on your Android device!**
          files: output_apk/IDE_Studio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
